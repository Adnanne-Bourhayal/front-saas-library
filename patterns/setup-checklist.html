<section data-fsl="setup-checklist" aria-label="Workspace setup">
  <div class="fs-head">
    <h2>Workspace setup</h2>
    <span class="fs-pill" role="status"></span>
  </div>
  <progress aria-label="Setup progress" value="1" max="3"></progress>
  <ul class="fs-rows">
    <li>
      <label><input type="checkbox" checked /> Name your workspace</label>
    </li>
    <li>
      <label><input type="checkbox" /> Invite a teammate</label>
    </li>
    <li>
      <label><input type="checkbox" /> Review notification settings</label>
    </li>
  </ul>
</section>
<script>
  ;(() => {
    const root = document.currentScript.previousElementSibling
    const checks = [...root.querySelectorAll('input')]
    function update() {
      const completed = checks.filter((check) => check.checked).length
      root.querySelector('progress').value = completed
      root.querySelector('[role=status]').textContent =
        completed === checks.length
          ? 'All set'
          : completed + ' of ' + checks.length + ' complete'
    }
    root.addEventListener('change', update)
    update()
  })()
</script>
