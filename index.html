<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" />
    <meta
      name="description"
      content="Browse twelve live SaaS interface patterns. Explore each design, try the controls and copy the working HTML, CSS and JavaScript."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/work-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Front/SaaS — Pattern library</title>
  </head>
  <body>
    <a class="skip" href="#gallery">Skip to patterns</a>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="./" aria-label="Front/SaaS home"
          >Front<span>/</span>SaaS</a
        >
        <nav aria-label="Main">
          <a href="#gallery">Library</a
          ><a href="https://github.com/Adnanne-Bourhayal/front-saas-library"
            >GitHub <span aria-hidden="true">↗</span></a
          >
        </nav>
      </div>
    </header>
    <main class="container">
      <div class="intro">
        <h1>Pattern library<span>.</span></h1>
        <p>
          Interactive building blocks for SaaS. Try a pattern and take the code.
        </p>
      </div>
      <section id="gallery" tabindex="-1" aria-label="Pattern gallery">
        <div class="catalog-tools">
          <nav class="categories" aria-label="Categories"></nav>
          <label class="search"
            ><span aria-hidden="true" class="lens"></span
            ><input
              id="search"
              type="search"
              placeholder="Find a pattern"
              aria-label="Find a pattern"
          /></label>
        </div>
        <div id="results"></div>
        <p id="no-results" hidden>
          No matching patterns.
          <button type="button" id="clear-search">Clear search</button>
        </p>
      </section>
    </main>
    <footer class="site-foot">
      <a href="./" class="brand" aria-label="Front/SaaS home"
        >Front<span>/</span>SaaS</a
      ><a
        href="https://github.com/Adnanne-Bourhayal/front-saas-library/blob/main/LICENSE"
        >MIT license ↗</a
      >
    </footer>
    <dialog id="viewer" aria-labelledby="pattern-title">
      <header class="dialog-head">
        <div>
          <p id="category"></p>
          <h2 tabindex="-1" id="pattern-title"></h2>
        </div>
        <button id="close" type="button" aria-label="Close preview">×</button>
      </header>
      <div class="dialog-body">
        <p id="instructions"></p>
        <div class="action-bar">
          <div class="view-switch" role="group" aria-label="View mode">
            <button id="preview-button" aria-pressed="true">Preview</button
            ><button id="code-button" aria-pressed="false">Code</button>
          </div>
          <button id="copy">Copy HTML</button>
        </div>
        <div id="stage">
          <iframe
            id="preview"
            title="Interactive example"
            sandbox="allow-scripts allow-forms"
          ></iframe>
        </div>
        <div id="editor" hidden>
          <pre
            tabindex="0"
            aria-label="Component source code"
          ><code id="source"></code></pre>
        </div>
        <div class="preview-foot" id="preview-foot">
          <div role="group" aria-label="Preview width">
            <button id="desktop" aria-pressed="true">Full width</button
            ><button id="mobile" aria-pressed="false">Mobile</button>
          </div>
          <button id="reset">Reset</button>
        </div>
        <p id="notice" role="status"></p>
        <details class="notes">
          <summary>Use in your project</summary>
          <p id="integration"></p>
          <p>
            Paste the HTML into your page source. Its styles, JavaScript and MIT
            notice are included.
          </p>
        </details>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
